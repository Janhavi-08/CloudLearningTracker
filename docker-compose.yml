services:
  cloudlearningtracker-db:
      image: mcr.microsoft.com/mssql/server:2022-latest
      container_name: cloudlearningtracker-db
      ports:
        - "1433:1433"
      environment:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
        MSSQL_PID: "Developer"
      volumes:
        - db-data:/var/opt/mssql
      restart: unless-stopped
      networks: 
        - backend
      healthcheck:
          test:
            [
              "CMD",
              "/opt/mssql-tools18/bin/sqlcmd",
              "-S",
              "localhost",
              "-U",
              "sa",
              "-P",
              "${MSSQL_SA_PASSWORD}",
              "-Q",
              "SELECT 1",
              "-C"
            ]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 30s

  cloudlearningtracker-api:
      build: 
        context: ./CloudLearningTracker.API
        dockerfile: Dockerfile
      container_name: cloudlearningtracker-api
      ports:
        - "5168:8080"
      environment:
        ASPNETCORE_URLS: "http://+:8080"
        Jwt__Key: ${Jwt__Key}
        Cors__AllowedOrigins__0: "http://localhost:4200"
        ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      depends_on:
        cloudlearningtracker-db:
          condition: service_healthy
      networks: 
          - frontend
          - backend

  cloudlearningtracker-ui:
      build: 
        context: ./CloudLearningTracker.UI
        dockerfile: Dockerfile
      container_name: cloudlearningtracker-ui
      ports:
        - "4200:80"
      depends_on:
        - cloudlearningtracker-api
      networks: 
        - frontend

volumes:
    db-data:

networks:
  frontend:    
  backend:
  
