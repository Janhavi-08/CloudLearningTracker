<div class="app-shell" *ngIf="showShell; else authView">
  <app-sidebar-nav
    [isOpen]="isSidebarOpen"
    [username]="username"
    (closed)="closeSidebar()"
    (logoutRequested)="logout()"
  ></app-sidebar-nav>

  <div class="main-panel">
    <div class="global-loader-overlay" *ngIf="isLoading$ | async">
      <div class="loader-box">
        <div class="loader-spinner"></div>
        <span>Loading...</span>
      </div>
    </div>
    <header class="top-bar">
      <button class="icon-button" type="button" (click)="openSidebar()" aria-label="Open navigation">☰</button>
      <div class="top-bar-title" (click)="openSidebar()">Cloud Learning Tracker</div>
      <div class="top-bar-spacer"></div>
       <div class="welcome-meta">
      <span class="pill">Today</span>
      <strong>{{ today | date:'fullDate' }}</strong>
    </div>
    </header>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<ng-template #authView>
  <router-outlet></router-outlet>
</ng-template>
