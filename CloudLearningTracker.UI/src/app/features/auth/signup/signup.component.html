<div class="auth-shell">
  <mat-card class="auth-card">
    <div class="auth-heading">
      <p class="eyebrow">Cloud Learning Tracker</p>
      <h1>Create an account</h1>
      <p class="subtitle">Start tracking your cloud learning path.</p>
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
        <mat-error *ngIf="signupForm.get('name')?.hasError('required')">Name is required.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" />
        <mat-error *ngIf="signupForm.get('email')?.hasError('required')">Email is required.</mat-error>
        <mat-error *ngIf="signupForm.get('email')?.hasError('email')">Enter a valid email.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" />
        <mat-error *ngIf="signupForm.get('password')?.hasError('required')">Password is required.</mat-error>
        <mat-error *ngIf="signupForm.get('password')?.hasError('minlength')">Password must be at least 6 characters.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input matInput formControlName="confirmPassword" type="password" />
        <mat-error *ngIf="signupForm.hasError('mismatch')">Passwords do not match.</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="isSubmitting || signupForm.invalid">
        <span *ngIf="!isSubmitting">Sign Up</span>
        <span *ngIf="isSubmitting">Creating account...</span>
      </button>
    </form>

    <p class="signup-link">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>
  </mat-card>
</div>
