name: Deploy CloudLearningTracker

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::455303857199:role/GitHubActions-ECR-Push-Role
          aws-region: ap-south-1

      # - name: Verify AWS Identity
      #   run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build API Image
        env:
         IMAGE_TAG: v${{ github.run_number }}
        run: | 
          docker build -t cloudlearningtracker-api:v${{ IMAGE_TAG }} ./CloudLearningTracker.API
          docker tag cloudlearningtracker-api:v${{ IMAGE_TAG }} 455303857199.dkr.ecr.ap-south-1.amazonaws.com/cloudlearningtracker/cloudlearningtracker-api:v${{ IMAGE_TAG }}
          docker push 455303857199.dkr.ecr.ap-south-1.amazonaws.com/cloudlearningtracker/cloudlearningtracker-api:v${{ IMAGE_TAG }}
      
      - name: Build UI Image
        env:
          IMAGE_TAG: v${{ github.run_number }}
        run: |
          docker build -t cloudlearningtracker-ui:v${{ IMAGE_TAG }} ./CloudLearningTracker.UI
          docker tag cloudlearningtracker-ui:v${{ IMAGE_TAG }} 455303857199.dkr.ecr.ap-south-1.amazonaws.com/cloudlearningtracker/cloudlearningtracker-ui:v${{ IMAGE_TAG }}
          docker push 455303857199.dkr.ecr.ap-south-1.amazonaws.com/cloudlearningtracker/cloudlearningtracker-ui:v${{ IMAGE_TAG }}

      - name: List Docker Images
        run: docker images